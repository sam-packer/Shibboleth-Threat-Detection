[project]
name = "shibboleth-threat-detection"
version = "3.0.0"
description = "A risk based authentication implementation designed for Shibboleth IdP"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "geoip2>=5.2.0",
    "gunicorn>=25.3.0",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "mlflow>=3.10.1",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "pandas-stubs>=3.0.0.260204",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "scipy-stubs>=1.17.1.3",
    "sqlalchemy>=2.0.48",
    "user-agents>=2.2.0",
    "waitress>=3.0.2",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.11.0",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "scipy>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
sources = { torch = { index = "cu130" } }

[[tool.uv.index]]
name = "cu130"
url = "https://download.pytorch.org/whl/cu130"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
api = "src.api.api:main"
api-prod = "src.api.main:main"
train = "src.training.train:main"
explain = "src.training.explain:main"
verify = "src.utils.config_validator:main"
